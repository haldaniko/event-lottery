# Add these locations inside the existing HTTPS server block for haldaniko.com.ua.
# Keep the proxy_pass URL without a trailing slash so the app receives its prefix.
location = /event-lottery {
    return 308 /event-lottery/;
}

location ^~ /event-lottery/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
